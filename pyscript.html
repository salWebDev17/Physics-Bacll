<script>
    (function(){
    function detectDeviceName(){
      const ua = navigator.userAgent;
      let os = 'Unknown';
      if(/android/i.test(ua)) os = 'Android';
      else if(/iphone|ipad|ipod/i.test(ua)) os = 'iOS';
      else if(/windows/i.test(ua)) os = 'Windows';
      else if(/mac os/i.test(ua)) os = 'macOS';
      else if(/linux/i.test(ua)) os = 'Linux';

      let browser = 'Browser';
      if(/vivo/i.test(ua)) browser = 'ViVo';
      else if(/samsung/i.test(ua)) browser = 'Samsung';
      else if(/edg/i.test(ua)) browser = 'Edge';
      else if(/chrome/i.test(ua)) browser = 'Chrome';
      else if(/firefox/i.test(ua)) browser = 'Firefox';
      else if(/safari/i.test(ua)) browser = 'Safari';

      return `${browser}-${os}`;
    }

    function saveEntry(ip){
      try{
        const page = location.pathname.split('/').pop().replace('.html','');
        const time = new Date().toLocaleString();
        const device = detectDeviceName();
        let entries = JSON.parse(localStorage.getItem('visitLog') || '[]');
        entries.push({ page: page, time: time, device: device, ip: ip });
        if(entries.length > 300) entries = entries.slice(-300);
        localStorage.setItem('visitLog', JSON.stringify(entries));
      }catch(e){}
    }

    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(data => saveEntry(data.ip))
      .catch(() => saveEntry('unknown'));
  })();

    explanation: "ច្បាប់គេលុយសាក់៖ នៅ V ថេរ \\(P_1/T_1 = P_2/T_2\\)។"
  },
  {
    category: "ថេរឧស្ម័ន",
    question: "តើទំនាក់ទំនងរវាង R, \\(N_A\\) និង \\(k_B\\) គឺជាអ្វី?",
    options: [
      "\\(R = N_A / k_B\\)",
      "\\(R = N_A \\times k_B\\)",
      "\\(R = k_B / N_A\\)",
      "\\(R = N_A + k_B\\)"
    ],
    correct: 1,
    explanation: "\\(R = N_A \\times k_B = 6.23 \\times 10^{23} \\times 1.38 \\times 10^{-23} = 8.31\\) J/(mol·K)។"
  },
  {
    category: "ម៉ាសមាឌ",
    question: "តើម៉ាសមាឌ \\(\\rho\\) គណនាតាមរូបមន្តណា?",
    options: [
      "\\(\\rho = \\frac{V}{m}\\)",
      "\\(\\rho = \\frac{m}{V}\\)",
      "\\(\\rho = mV\\)",
      "\\(\\rho = \\frac{m_0}{V}\\)"
    ],
    correct: 1,
    explanation: "ម៉ាសមាឌ \\(\\rho = \\frac{m}{V}\\) គិតជា kg/m³។"
  },
  {
    category: "រូបមន្តសម្ពាធ",
    question: "តើរូបមន្តសម្ពាធតាមថាមពលស៊ីនេទិចមធ្យម \\(K_{av}\\) គឺជាអ្វី?",
    options: [
      "\\(P = \\frac{1}{3} \\frac{N}{V} K_{av}\\)",
      "\\(P = \\frac{2}{3} \\frac{N}{V} K_{av}\\)",
      "\\(P = \\frac{3}{2} \\frac{N}{V} K_{av}\\)",
      "\\(P = \\frac{N}{V} K_{av}\\)"
    ],
    correct: 1,
    explanation: "\\(P = \\frac{2}{3} \\frac{N}{V} K_{av}\\) ដែល \\(K_{av} = \\frac{1}{2}m_0V_{av}^2\\)។"
  }
];

/* ============ ស្ថានភាព ============ */
const state = {
  currentIdx: 0,
  selected: null,
  answers: [],
  showResult: false,
  isFinished: false,
  isReview: false
};

const mainEl = document.getElementById('main');
const subtitleEl = document.getElementById('subtitle');

/* ============ មុខងារ ============ */
function typesetMath() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise().catch(() => {});
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderProgress() {
  const total = questions.length;
  const current = state.currentIdx + 1;
  const pct = Math.round((current / total) * 100);
  return `
    <div class="progress-wrapper">
      <div class="progress-info">
        <span>សំណួរទី ${current} នៃ ${total}</span>
        <span>${pct}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${pct}%"></div>
      </div>
    </div>
  `;
}

function renderQuestion() {
  const q = questions[state.currentIdx];
  const total = questions.length;

  let optionsHtml = '';
  q.options.forEach((opt, idx) => {
    let cls = 'option';
    if (state.showResult) {
      if (idx === q.correct) cls += ' correct';
      else if (idx === state.selected && state.selected !== q.correct) cls += ' wrong';
    } else if (state.selected === idx) {
      cls += ' selected';
    }

    let icons = '';
    if (state.showResult && idx === q.correct) {
      icons = '<span class="check-icon">✓</span>';
    } else if (state.showResult && idx === state.selected && idx !== q.correct) {
      icons = '<span class="cross-icon">✗</span>';
    }

    optionsHtml += `
      <button class="${cls}" data-idx="${idx}" ${state.showResult ? 'disabled' : ''}>
        <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
        <span class="option-text">${opt}</span>
        ${icons}
      </button>
    `;
  });

  const explanationHtml = state.showResult
    ? `<div class="explanation"><strong>💡 ពន្យល់៖</strong> ${q.explanation}</div>`
    : '';

  const actionBtn = !state.showResult
    ? `<button class="btn btn-primary" id="confirmBtn" ${state.selected === null ? 'disabled' : ''}>បញ្ជាក់ចម្លើយ</button>`
    : `<button class="btn btn-success" id="nextBtn">${state.currentIdx + 1 >= total ? 'បញ្ចប់ និងមើលលទ្ធផល' : 'សំណួរបន្ទាប់ →'}</button>`;

  mainEl.innerHTML = `
    ${renderProgress()}
    <div class="question-card">
      <div class="category-badge">${q.category}</div>
      <h3 class="question-text">${q.question}</h3>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
      <div class="quiz-actions">${actionBtn}</div>
    </div>
  `;

  // Event listeners
  mainEl.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.showResult) return;
      state.selected = parseInt(btn.dataset.idx, 10);
      renderQuestion();
    });
  });

  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', () => {
      if (state.selected === null) return;
      state.showResult = true;
      state.answers.push({ idx: state.currentIdx, selected: state.selected });
      renderQuestion();
    });
  }

  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (state.currentIdx + 1 >= questions.length) {
        state.isFinished = true;
        renderResult();
      } else {
        state.currentIdx++;
        state.selected = null;
        state.showResult = false;
        renderQuestion();
      }
    });
  }

  typesetMath();
}

function calculateScore() {
  return state.answers.reduce((score, ans) => {
    return score + (questions[ans.idx].correct === ans.selected ? 1 : 0);
  }, 0);
}

function renderResult() {
  const score = calculateScore();
  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  let message = '', emoji = '';
  if (pct >= 80) { message = 'ពិតជាល្អណាស់! អ្នកពូកែរូបវិទ្យាណាស់ 🎉'; emoji = '🏆'; }
  else if (pct >= 60) { message = 'ល្អ! ប៉ុន្តែអ្នកអាចធ្វើបានល្អជាងនេះទៀត។'; emoji = '👍'; }
  else if (pct >= 40) { message = 'មធ្យម! សូមព្យាយាមម្តងទៀត។'; emoji = '📖'; }
  else { message = 'ត្រូវខិតខំបន្ថែម! សូមអានរូបមន្តម្តងទៀត។'; emoji = '💪'; }

  const circumference = 339.29;
  const dash = (pct / 100) * circumference;

  subtitleEl.textContent = `លទ្ធផលរបស់អ្នក`;

  mainEl.innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <h2>លទ្ធផលរបស់អ្នក</h2>
      <div class="score-circle">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" class="score-bg" />
          <circle cx="60" cy="60" r="54" class="score-progress"
            stroke-dasharray="${dash} ${circumference}" />
        </svg>
        <div class="score-text">
          <span class="score-num">${score}</span>
          <span class="score-total">/ ${total}</span>
        </div>
      </div>
      <p class="score-percentage">${pct}%</p>
      <p class="result-message">${message}</p>
      <div class="result-actions">
        <button class="btn btn-primary" id="restartBtn">🔄 ធ្វើម្តងទៀត</button>
        <button class="btn btn-secondary" id="reviewBtn">📝 ពិនិត្យចម្លើយ</button>
      </div>
    </div>
  `;

document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('reviewBtn').addEventListener('click', () => {
    state.isReview = true;
    state.isFinished = false;
    state.currentIdx = 0;
    state.selected = null;
    state.showResult = true;
    renderReview();
  });

  typesetMath();
}

function renderReview() {
  subtitleEl.textContent = 'ពិនិត្យចម្លើយ';

  let itemsHtml = '';
  questions.forEach((q, idx) => {
    const ans = state.answers.find(a => a.idx === idx);
    const userSelected = ans ? ans.selected : -1;
    const isCorrect = userSelected === q.correct;

    let optsHtml = '';
    q.options.forEach((opt, i) => {
      let cls = 'review-opt';
      if (i === q.correct) cls += ' correct';
      else if (i === userSelected) cls += ' wrong';
      optsHtml += `<div class="${cls}"><strong>${String.fromCharCode(65 + i)}.</strong> ${opt}</div>`;
    });

    itemsHtml += `
      <div class="review-item">
        <div class="review-header">
          <span class="review-num">សំណួរទី ${idx + 1}</span>
          <span class="review-status ${isCorrect ? 'correct' : 'wrong'}">
            ${isCorrect ? '✓ ត្រឹមត្រូវ' : '✗ ខុស'}
          </span>
        </div>
        <p class="review-question">${q.question}</p>
        <div class="review-options">${optsHtml}</div>
        <div class="explanation"><strong>💡 ពន្យល់៖</strong> ${q.explanation}</div>
      </div>
    `;
  });

  mainEl.innerHTML = `
    <div class="review-container">
      <h2 class="review-title">📝 ពិនិត្យចម្លើយ</h2>
      ${itemsHtml}
      <button class="btn btn-primary" id="restartBtn" style="width:100%;">🔄 ចាប់ផ្តើមឡើងវិញ</button>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', restart);
  typesetMath();
}

function restart() {
  state.currentIdx = 0;
  state.selected = null;
  state.answers = [];
  state.showResult = false;
  state.isFinished = false;
  state.isReview = false;
  subtitleEl.textContent = `សូមជ្រើសរើសចម្លើយត្រឹមត្រូវខាងក្រោម | មានចំនួន ${questions.length} សំណួរ`;
  renderQuestion();
}

/* ============ ចាប់ផ្តើម ============ */
subtitleEl.textContent = `សូមជ្រើសរើសចម្លើយត្រឹមត្រូវខាងក្រោម | មានចំនួន ${questions.length} សំណួរ`;
renderQuestion();
</script>

</body>
